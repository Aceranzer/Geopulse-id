<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Geopulse-ID{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">Geopulse-ID</div>
      <nav class="nav">
        {% for href, label in nav %}
          <a href="{{ href }}" {% if request.path == href %}class="active"{% endif %}>{{ label }}</a>
        {% endfor %}
        <button class="btn" type="button" onclick="window.print()">Print Document A4</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px; padding-bottom:32px;">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container"><b>Geopulse-ID</b> Sistem Prioritas Mitigasi Risiko Banjir Multi-Kriteria</div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
